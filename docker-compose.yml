services:
  redis:
    image: redis:7-alpine
    container_name: ceris-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ceris

  ms-ia:
    build:
      context: .
      dockerfile: Dockerfile
    image: ceris/ms-ia:latest
    container_name: ceris-ms-ia
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${MS_IA_PORT:-8000}:8000"
    networks:
      - ceris

networks:
  ceris:
    driver: bridge

volumes:
  redis-data:
