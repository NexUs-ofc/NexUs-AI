services:
  ms-ia:
    build:
      context: .
      dockerfile: Dockerfile
    image: ceris/ms-ia:latest
    container_name: ceris-ms-ia
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${MS_IA_PORT:-8000}:8000"
    networks:
      - ceris

networks:
  ceris:
    driver: bridge
