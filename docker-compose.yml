services:
  ms-ia:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ceris/ms-ia:latest
    container_name: ceris-ms-ia
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${MS_IA_PORT:-8000}:8000"
    networks:
      - ceris

  tests:
    profiles:
      - tests
    build:
      context: .
      dockerfile: Dockerfile
      target: tests
    image: ceris/ms-ia:tests
    container_name: ceris-ms-ia-tests
    env_file:
      - .env
    environment:
      LANGCHAIN_TRACING_V2: "false"
    networks:
      - ceris

networks:
  ceris:
    driver: bridge
